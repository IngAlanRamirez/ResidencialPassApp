<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth"></ion-back-button>
    </ion-buttons>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login">
  <div class="login__container">
    <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <ion-input
        formControlName="phone"
        type="tel"
        label="Teléfono"
        labelPlacement="stacked"
        placeholder="Ej. 5512345678"
        inputmode="tel"
        errorText="Ingresa un teléfono válido."
        fill="outline"
        class="login__field"
      ></ion-input>

      <ion-input
        formControlName="password"
        [type]="showPassword() ? 'text' : 'password'"
        label="Contraseña"
        labelPlacement="stacked"
        placeholder="Tu contraseña"
        errorText="Mínimo 6 caracteres."
        fill="outline"
        class="login__field"
      >
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          class="login__eye-btn"
          (click)="togglePasswordVisibility()"
          aria-label="Mostrar u ocultar contraseña"
        >
          <ion-icon
            slot="icon-only"
            [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-button>
      </ion-input>

      <div class="login__remember">
        <ion-checkbox
          [checked]="rememberPassword()"
          (ionChange)="onRememberChange($any($event))"
          labelPlacement="end"
        >
          Recordar contraseña
        </ion-checkbox>
      </div>

      <div class="login__actions">
        <ion-button
          type="submit"
          expand="block"
          [disabled]="loadingSubmit()"
          class="login__submit"
        >
          @if (loadingSubmit()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Entrar
          }
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>

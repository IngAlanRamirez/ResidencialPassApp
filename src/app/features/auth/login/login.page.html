<!-- Header oscuro -->
  <div class="login-header">
    <button class="login-header__back" (click)="goBack()" type="button">←</button>
    <div>
      <h1 class="login-header__title">Bienvenido</h1>
      <p class="login-header__subtitle">Ingresá tus datos</p>
    </div>
  </div>

  <ion-content [fullscreen]="true">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <rp-input
        label="Teléfono"
        type="tel"
        placeholder="+52 55 1234 5678"
        formControlName="phone"
        [errorMessage]="phoneError()"
      />

      <rp-input
        label="Contraseña"
        type="password"
        placeholder="Tu contraseña"
        formControlName="password"
        [errorMessage]="passwordError()"
      />

      <!-- Recordar contraseña -->
      <label class="login-remember">
        <input
          type="checkbox"
          [checked]="rememberPassword()"
          (change)="rememberPassword.set(!rememberPassword())"
          class="login-remember__checkbox"
        />
        <span class="login-remember__label">Recordar contraseña</span>
      </label>

      <rp-button type="submit" [loading]="loadingSubmit()">
        Ingresar
      </rp-button>

      <button type="button" class="login-forgot">Olvidé mi contraseña</button>

    </form>
  </ion-content>

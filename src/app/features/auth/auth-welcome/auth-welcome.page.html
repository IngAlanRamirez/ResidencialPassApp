<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="welcome">

    <!-- Hero -->
    <div class="welcome__hero">
      <div class="welcome__logo">🏘️</div>
      <h1 class="welcome__title">Residencial<br/>Villa María</h1>
      <p class="welcome__tagline">Control de acceso inteligente</p>
    </div>

    <!-- Actions -->
    <div class="welcome__actions">
      <rp-button routerLink="/auth/login">Iniciar sesión</rp-button>
      <rp-button variant="secondary" routerLink="/auth/register">Registrarme</rp-button>
      <p class="welcome__brand">AR Solutions MX</p>
    </div>

  </div>
</ion-content>

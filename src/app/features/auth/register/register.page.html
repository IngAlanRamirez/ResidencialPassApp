<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth"></ion-back-button>
    </ion-buttons>
    <ion-title>Registro de vecino</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="register">
  <div class="register__container">
    @if (hasStreetsError()) {
      <p class="register__hint">No hay calles disponibles. Contacta al administrador.</p>
    }

    @if (loadingStreets()) {
      <div class="register__loader">
        <ion-spinner name="crescent"></ion-spinner>
        <span class="register__loader-text">Cargando calles…</span>
      </div>
    } @else {
      <form
        class="register__form"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
      >
        <ion-select
          formControlName="street"
          label="Calle"
          labelPlacement="stacked"
          placeholder="Selecciona tu calle"
          interface="action-sheet"
          fill="outline"
          class="register__field"
        >
          @for (street of streets(); track street.id) {
            <ion-select-option [value]="street.name">{{ street.name }}</ion-select-option>
          }
        </ion-select>

        <ion-input
          formControlName="number"
          type="text"
          label="Número"
          labelPlacement="stacked"
          placeholder="Ej. 14"
          inputmode="numeric"
          errorText="El número es requerido."
          fill="outline"
          class="register__field"
        ></ion-input>

        <ion-input
          formControlName="letter"
          type="text"
          label="Letra (opcional)"
          labelPlacement="stacked"
          placeholder="Ej. A, B"
          maxlength="20"
          fill="outline"
          class="register__field"
        ></ion-input>

        <ion-input
          formControlName="phone"
          type="tel"
          label="Teléfono"
          labelPlacement="stacked"
          placeholder="Ej. 5512345678"
          inputmode="tel"
          errorText="Ingresa un teléfono válido."
          fill="outline"
          class="register__field"
        ></ion-input>

        <ion-input
          formControlName="password"
          [type]="showPassword() ? 'text' : 'password'"
          label="Contraseña"
          labelPlacement="stacked"
          placeholder="Mínimo 6 caracteres"
          errorText="Mínimo 6 caracteres."
          fill="outline"
          class="register__field"
        >
          <ion-button
            fill="clear"
            slot="end"
            type="button"
            class="register__eye-btn"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar u ocultar contraseña"
          >
            <ion-icon
              slot="icon-only"
              [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </ion-input>

        <ion-input
          formControlName="confirmPassword"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          label="Confirmar contraseña"
          labelPlacement="stacked"
          placeholder="Repite tu contraseña"
          errorText="Confirma tu contraseña correctamente."
          fill="outline"
          class="register__field"
        >
          <ion-button
            fill="clear"
            slot="end"
            type="button"
            class="register__eye-btn"
            (click)="toggleConfirmPasswordVisibility()"
            aria-label="Mostrar u ocultar contraseña"
          >
            <ion-icon
              slot="icon-only"
              [name]="showConfirmPassword() ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </ion-input>

        <div class="register__actions">
          <ion-button
            type="submit"
            expand="block"
            [disabled]="loadingSubmit()"
            class="register__submit"
          >
            @if (loadingSubmit()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              Registrarme
            }
          </ion-button>
        </div>
      </form>
    }
  </div>
</ion-content>

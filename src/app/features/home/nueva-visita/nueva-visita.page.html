<div class="nv-header">
  <button class="nv-header__back" (click)="goBack()" type="button" aria-label="Volver">←</button>
  <div class="nv-header__titles">
    <h1 class="nv-header__title">Nueva Visita</h1>
    <p class="nv-header__subtitle">{{ addressLabel() }}</p>
  </div>
  <button type="button" class="nv-header__logout" (click)="confirmLogout()" aria-label="Cerrar sesión">
    Salir
  </button>
</div>

<ion-content>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="nv-form">
    <rp-input
      label="Nombre del visitante"
      type="text"
      placeholder="Ej. Juan García"
      formControlName="visitorName"
    />

    <label class="nv-select-wrapper">
      <span class="nv-select-label">Motivo</span>
      <select class="nv-select" formControlName="reason">
        @for (opt of reasonOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <span class="nv-select-arrow" aria-hidden="true">⌄</span>
    </label>

    <div class="nv-schedule">
      <p class="nv-schedule__label">Tipo de horario</p>
      <div class="nv-schedule__chips">
        <button
          type="button"
          class="nv-chip"
          [class.nv-chip--active]="scheduleType() === 'open'"
          (click)="setScheduleType('open')"
        >
          Abierto
        </button>
        <button
          type="button"
          class="nv-chip"
          [class.nv-chip--active]="scheduleType() === 'datetime'"
          (click)="setScheduleType('datetime')"
        >
          Fecha / hora
        </button>
      </div>
      @if (scheduleType() === 'open') {
        <p class="nv-schedule__hint">
          Las horas de entrada y salida se registran al escanear el QR en caseta.
        </p>
      }
    </div>

    @if (scheduleType() === 'datetime') {
      <rp-input
        label="Entrada"
        type="datetime-local"
        formControlName="entryAt"
        [min]="minEntryLocal"
      />
      <rp-input
        label="Salida"
        type="datetime-local"
        formControlName="exitAt"
        [min]="minExitLocal"
      />
    }

    <rp-input
      label="Nota (opcional)"
      type="text"
      placeholder="Instrucciones adicionales"
      formControlName="description"
    />

    <rp-button type="submit" [loading]="loadingSubmit()">
      Generar código QR →
    </rp-button>
  </form>
</ion-content>

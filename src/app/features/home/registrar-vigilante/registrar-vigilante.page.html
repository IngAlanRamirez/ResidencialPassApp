<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Registrar vigilante</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="confirmLogout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="registrar-vigilante">
  <div class="registrar-vigilante__container">
    <form class="registrar-vigilante__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <ion-input
        formControlName="phone"
        type="tel"
        label="Teléfono"
        labelPlacement="stacked"
        placeholder="Ej. 5512345678"
        inputmode="tel"
        errorText="Ingresa un teléfono válido."
        fill="outline"
        class="registrar-vigilante__field"
      ></ion-input>

      <ion-input
        formControlName="password"
        [type]="showPassword() ? 'text' : 'password'"
        label="Contraseña"
        labelPlacement="stacked"
        placeholder="Mínimo 6 caracteres"
        errorText="Mínimo 6 caracteres."
        fill="outline"
        class="registrar-vigilante__field"
      >
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          class="registrar-vigilante__eye-btn"
          (click)="togglePasswordVisibility()"
          aria-label="Mostrar u ocultar contraseña"
        >
          <ion-icon
            slot="icon-only"
            [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-button>
      </ion-input>

      <ion-input
        formControlName="confirmPassword"
        [type]="showConfirmPassword() ? 'text' : 'password'"
        label="Confirmar contraseña"
        labelPlacement="stacked"
        placeholder="Repite la contraseña"
        errorText="Las contraseñas no coinciden."
        fill="outline"
        class="registrar-vigilante__field"
      >
        <ion-button
          fill="clear"
          slot="end"
          type="button"
          class="registrar-vigilante__eye-btn"
          (click)="toggleConfirmPasswordVisibility()"
          aria-label="Mostrar u ocultar contraseña"
        >
          <ion-icon
            slot="icon-only"
            [name]="showConfirmPassword() ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-button>
      </ion-input>

      <div class="registrar-vigilante__actions">
        <ion-button
          type="submit"
          expand="block"
          [disabled]="loadingSubmit()"
          class="registrar-vigilante__submit"
        >
          @if (loadingSubmit()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Registrar vigilante
          }
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>

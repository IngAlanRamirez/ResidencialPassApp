<div class="register-header">
  <div class="register-header__top register-header__top--with-logout">
    <button
      class="register-header__back"
      type="button"
      aria-label="Volver"
      (click)="goBack()"
    >←</button>
    <div class="register-header__titles">
      <h1 class="register-header__title">Registrar vigilante</h1>
      <p class="register-header__subtitle">Alta de acceso para personal de vigilancia</p>
    </div>
    <button
      class="register-header__logout"
      type="button"
      (click)="confirmLogout()"
    >Salir</button>
  </div>
</div>

<ion-content [fullscreen]="true">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form">
    <p class="register-step-label">DATOS DE ACCESO</p>

    <rp-input
      label="Teléfono"
      type="tel"
      placeholder="+52 55 1234 5678"
      formControlName="phone"
      [errorMessage]="form.get('phone')?.invalid && form.get('phone')?.touched ? 'Ingresá un número válido' : ''"
    />

    <rp-input
      label="Contraseña"
      type="password"
      placeholder="Mínimo 8 caracteres"
      formControlName="password"
      [errorMessage]="form.get('password')?.invalid && form.get('password')?.touched ? 'Mínimo 8 caracteres' : ''"
    />

    <rp-input
      label="Confirmar contraseña"
      type="password"
      placeholder="Repetí la contraseña"
      formControlName="confirmPassword"
      [errorMessage]="confirmPasswordError()"
    />

    <rp-button type="submit" [loading]="loadingSubmit()" [disabled]="form.invalid || loadingSubmit()">
      Registrar vigilante
    </rp-button>
  </form>
</ion-content>
